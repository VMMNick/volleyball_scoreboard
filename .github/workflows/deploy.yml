name: tests

# Перевіряє кожен пуш і pull request: синтаксис, збирання й усі тести.
# Сам деплой робить Render (render.yaml) — він підхоплює пуш у main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  e2e:
    # Справжній браузер і справжній сервер: пульт, глядач, другий суддя, рестарт сервера.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

# Render Blueprint: табло + сервер трансляції (WebSocket /ws).
# Один сервіс роздає сайт і тримає кімнати, тож посилання для глядачів і OBS
# живуть на тому ж домені, що й пульт.
services:
  - type: web
    name: volleyball-scoreboard
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /healthz

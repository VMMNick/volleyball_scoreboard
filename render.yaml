# Render Blueprint: табло + сервер синхронізації (WebSocket /ws).
# Один сервіс роздає сайт і тримає кімнати матчів, тож посилання на міні-табло
# й пульт для другого судді живуть на тому ж домені, що й пульт.
services:
  - type: web
    name: volleyball-scoreboard
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Секрет для доказів власності кімнат: після перезапуску сервера кімната
      # повертається своєму судді. Render згенерує його сам і більше не міняє.
      - key: ROOM_SECRET
        generateValue: true
      # Акаунти суддів і адмін-панель (необовʼязково). Без DATABASE_URL табло працює, як і раніше.
      # DATABASE_URL — рядок підключення Neon Postgres (postgres://…?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
